# astrolift.toml — Astrolift app manifest
#
# Agents only: no deployment, no managed services, nothing standing. Each
# workload is kind=agent with run_family=task, so it spawns as a Job on
# dispatch and holds no resource between runs. Idle cost is zero.
#
# One image, three roles, selected by AGENT_ROLE. The roles chain: triage
# produces findings, summarize turns them into a brief, review states a case
# for the human gate that follows it in workflows/review-loop.toml.

astrolift_version = 1
name = "conflict-agent-suite"

[app]
slug = "conflict-agent-suite"
display_name = "Agent Suite"

[environments.production]

[[workloads]]
name = "triage"
kind = "agent"
run_family = "task"
cpu_request = "50m"
cpu_limit = "250m"
memory_request = "128Mi"
memory_limit = "256Mi"

  [[workloads.containers]]
  name = "triage"
  is_primary = true
  command = ["python", "agent.py"]

    [workloads.containers.env]
    PYTHONUNBUFFERED = "1"
    AGENT_ROLE = "triage"

[[workloads]]
name = "summarize"
kind = "agent"
run_family = "task"
cpu_request = "50m"
cpu_limit = "250m"
memory_request = "128Mi"
memory_limit = "256Mi"

  [[workloads.containers]]
  name = "summarize"
  is_primary = true
  command = ["python", "agent.py"]

    [workloads.containers.env]
    PYTHONUNBUFFERED = "1"
    AGENT_ROLE = "summarize"

[[workloads]]
name = "review"
kind = "agent"
run_family = "task"
cpu_request = "50m"
cpu_limit = "250m"
memory_request = "128Mi"
memory_limit = "256Mi"

  [[workloads.containers]]
  name = "review"
  is_primary = true
  command = ["python", "agent.py"]

    [workloads.containers.env]
    PYTHONUNBUFFERED = "1"
    AGENT_ROLE = "review"
