# astrolift.toml — one agent, per the sanctioned agents/<slug>/ layout.
#
# Turns triage findings into a written brief.
#
# kind=agent + run_family=task means this spawns as a Job on dispatch and
# holds no resource between runs. Idle cost is zero.

astrolift_version = 1
name = "conflict-agent-summarize"

[app]
slug = "conflict-agent-summarize"
display_name = "Agent: summarize"

[environments.production]

[[workloads]]
name = "summarize"
kind = "agent"
run_family = "task"
cpu_request = "50m"
cpu_limit = "250m"
memory_request = "128Mi"
memory_limit = "256Mi"

  [[workloads.containers]]
  name = "summarize"
  is_primary = true
  command = ["python", "agent.py"]

    [workloads.containers.env]
    PYTHONUNBUFFERED = "1"
    AGENT_ROLE = "summarize"
